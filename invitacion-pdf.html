<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación Baby Shower - Renato Emiliano</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @page {
            size: A5 portrait;
            margin: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(180deg, #FDF8F3 0%, #FAF0E6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .invitation {
            width: 148mm;
            height: 210mm;
            background: linear-gradient(135deg, #FDF8F3 0%, #FAEBD7 50%, #FFF8F0 100%);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(139, 111, 92, 0.2);
        }

        /* Borde decorativo beige */
        .invitation::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            border: 2px solid rgba(210, 180, 140, 0.4);
            border-radius: 5px;
            pointer-events: none;
            z-index: 1;
        }

        /* Banderines */
        .bunting {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 60%;
            height: 40px;
            z-index: 2;
        }

        .bunting-string {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: #A08679;
            transform: rotate(3deg);
        }

        .flag {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 22px solid #87CEEB;
            top: 2px;
        }

        .flag:nth-child(2) {
            left: 10px;
        }

        .flag:nth-child(3) {
            left: 35px;
            border-top-color: #A4C8E8;
        }

        .flag:nth-child(4) {
            left: 60px;
        }

        .flag:nth-child(5) {
            left: 85px;
            border-top-color: #A4C8E8;
        }

        .flag:nth-child(6) {
            left: 110px;
        }

        /* Estrellas decorativas */
        .star {
            position: absolute;
            color: #DAA520;
            font-size: 1rem;
            opacity: 0.7;
            z-index: 2;
        }

        .star-1 {
            top: 25%;
            left: 5%;
        }

        .star-2 {
            top: 45%;
            left: 8%;
        }

        .star-3 {
            top: 65%;
            left: 3%;
        }

        .star-4 {
            top: 20%;
            right: 45%;
        }

        .star-5 {
            top: 85%;
            left: 10%;
        }

        /* Osito */
        .teddy-container {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 50%;
            height: 60%;
            z-index: 3;
            background: linear-gradient(135deg, #FDF8F3 0%, #FAEBD7 100%);
            border-radius: 20px 0 0 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 15px;
        }

        .teddy-container img {
            width: 90%;
            height: 90%;
            object-fit: contain;
            object-position: center bottom;
        }

        /* Contenido */
        .content {
            position: relative;
            z-index: 4;
            padding: 60px 30px 30px 35px;
            width: 60%;
        }

        .title {
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            color: #8B6F5C;
            line-height: 1;
            margin-bottom: 5px;
        }

        .baby-name {
            font-family: 'Great Vibes', cursive;
            font-size: 2.4rem;
            color: #6B8E9F;
            margin-bottom: 15px;
        }

        .message {
            font-size: 0.85rem;
            color: #7A6555;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* Detalles */
        .details {
            border-left: 2px solid #D4B896;
            padding-left: 15px;
            margin-bottom: 20px;
        }

        .detail-item {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(212, 184, 150, 0.4);
        }

        .detail-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .detail-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: #5D4E42;
        }

        /* Confirmar */
        .confirm-section {
            margin-top: 20px;
        }

        .confirm-title {
            font-size: 0.9rem;
            color: #7A6555;
            margin-bottom: 8px;
        }

        .confirm-link {
            display: inline-block;
            padding: 10px 25px;
            background: linear-gradient(135deg, #87CEEB 0%, #6BA3C4 100%);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .website-text {
            font-size: 0.75rem;
            color: #8B7355;
            margin-top: 8px;
        }

        /* Teléfono decorativo */
        .phone-icon {
            position: absolute;
            bottom: 80px;
            left: 30px;
            font-size: 2rem;
            opacity: 0.6;
            z-index: 2;
        }

        /* Botón imprimir */
        .print-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 30px;
            background: linear-gradient(135deg, #8B6F5C 0%, #A08679 100%);
            border: none;
            border-radius: 50px;
            font-family: 'Quicksand', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(139, 111, 92, 0.4);
        }

        .print-btn:hover {
            transform: scale(1.05);
        }

        @media print {
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            body {
                padding: 0;
                background: white;
            }

            .print-btn {
                display: none !important;
            }

            .invitation {
                box-shadow: none;
            }
        }
    </style>
</head>

<body>
    <div class="invitation">
        <!-- Banderines -->
        <div class="bunting">
            <div class="bunting-string"></div>
            <div class="flag"></div>
            <div class="flag"></div>
            <div class="flag"></div>
            <div class="flag"></div>
            <div class="flag"></div>
        </div>

        <!-- Estrellas -->
        <span class="star star-1">★</span>
        <span class="star star-2">★</span>
        <span class="star star-3">★</span>
        <span class="star star-4">★</span>
        <span class="star star-5">★</span>

        <!-- Osito -->
        <div class="teddy-container">
            <img src="images/teddy-bear.png" alt="Osito">
        </div>

        <!-- Contenido -->
        <div class="content">
            <h1 class="title">Baby Shower</h1>
            <h2 class="baby-name">de Renato Emiliano</h2>

            <p class="message">
                Acompáñanos a celebrar la dulce<br>
                espera de nuestro amado bebé.
            </p>

            <div class="details">
                <div class="detail-item">
                    <p class="detail-value">Domingo, 18 de Enero 2026</p>
                </div>
                <div class="detail-item">
                    <p class="detail-value">3:30 p.m.</p>
                </div>
                <div class="detail-item">
                    <p class="detail-value">Villa Los Molles<br><span
                            style="font-weight: 500; font-size: 0.9rem;">Comas, Lima</span></p>
                </div>
            </div>

            <div class="confirm-section">
                <p class="confirm-title">Confirma tu asistencia:</p>
                <a href="https://TU-URL-AQUI.com" class="confirm-link">🧸 Regístrate Aquí</a>
                <p class="website-text">O visita: TU-URL-AQUI.com</p>
            </div>
        </div>

        <!-- Teléfono decorativo -->
        <div class="phone-icon">📞</div>
    </div>

    <button class="print-btn" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
</body>

</html>
